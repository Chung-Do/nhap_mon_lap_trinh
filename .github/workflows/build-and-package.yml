name: Build and Package

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:  # Allow manual trigger

jobs:
  build:
    runs-on: windows-latest
    
    steps:
      # Step 1: Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Setup Java (JDK 17 for Maven build, jlink, and Launch4j)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # Clean old artifacts and Maven cache (prevent cache issues)
      - name: Clean Old Artifacts and Cache
        run: |
          Write-Host "=== Cleaning old artifacts ===" -ForegroundColor Cyan

          # Remove target directory
          if (Test-Path "target") {
            Write-Host "Removing old target directory..." -ForegroundColor Yellow
            Remove-Item -Path "target" -Recurse -Force
          }

          # Remove old EXE files
          if (Test-Path "RemoteServer.exe") {
            Remove-Item "RemoteServer.exe" -Force
          }
          if (Test-Path "RemoteClient.exe") {
            Remove-Item "RemoteClient.exe" -Force
          }

          # Remove dist folder
          if (Test-Path "dist") {
            Remove-Item -Path "dist" -Recurse -Force
          }

          # Clear local Maven repo cache for this project (prevents stale artifacts)
          $MavenCache = "$env:USERPROFILE\.m2\repository\com\remotecontrol"
          if (Test-Path $MavenCache) {
            Write-Host "Clearing Maven local cache for project..." -ForegroundColor Yellow
            Remove-Item -Path $MavenCache -Recurse -Force
          }

          Write-Host "✓ Cleanup complete" -ForegroundColor Green
        shell: pwsh

      # Step 3: Build with Maven (force update to avoid cache issues)
      - name: Build with Maven
        run: mvn clean package -DskipTests -U

      # Verify JAR files were created
      - name: Verify JAR Files
        run: |
          Write-Host "=== Checking generated JAR files ===" -ForegroundColor Cyan
          if (Test-Path "target\remote-server.jar") {
            $size = (Get-Item "target\remote-server.jar").Length / 1MB
            Write-Host "✓ remote-server.jar created ($([math]::Round($size, 2)) MB)" -ForegroundColor Green
          } else {
            Write-Error "remote-server.jar not found!"
          }
          if (Test-Path "target\remote-client.jar") {
            $size = (Get-Item "target\remote-client.jar").Length / 1MB
            Write-Host "✓ remote-client.jar created ($([math]::Round($size, 2)) MB)" -ForegroundColor Green
          } else {
            Write-Error "remote-client.jar not found!"
          }
        shell: pwsh
      
      # Step 4: Install Launch4j (wraps JAR into .exe with bundled JRE path)
      - name: Install Launch4j
        run: choco install launch4j -y --no-progress
        shell: cmd

      # Step 5: Download Warp Packer (bundles a directory into a single .exe)
      - name: Download Warp Packer
        run: |
          Invoke-WebRequest `
            -Uri "https://github.com/dgiagio/warp/releases/download/v0.3.0/windows-x64.warp-packer.exe" `
            -OutFile "warp-packer.exe"
        shell: pwsh

      # Step 6: Run packaging script (jlink → Launch4j → warp-packer)
      - name: Package Client and Server
        run: pwsh -NoProfile -File .\scripts\package.ps1
      
      # Step 7: Upload single-file executables as artifacts
      - name: Upload Server EXE
        uses: actions/upload-artifact@v4
        with:
          name: RemoteServer
          path: RemoteServer.exe
      
      - name: Upload Client EXE
        uses: actions/upload-artifact@v4
        with:
          name: RemoteClient
          path: RemoteClient.exe
      
      # Step 8: Create Release and attach EXEs (only on version tags)
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          files: |
            RemoteServer.exe
            RemoteClient.exe
      
      # Step 11: Display build summary
      - name: Build Summary
        run: |
          echo "=== BUILD SUMMARY ==="
          echo "✓ Maven build completed"
          echo "✓ jlink minimal JRE created (~40 MB)"
          echo "✓ Launch4j wrappers created"
          echo "✓ RemoteServer.exe – single file, no Java required"
          echo "✓ RemoteClient.exe – single file, no Java required"
          echo "Artifacts ready for download!"
